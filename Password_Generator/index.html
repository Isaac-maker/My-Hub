<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraSecure Gen</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 160px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }

        h2 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); }

        footer {text-align: center; margin-top: 15px; }

        .result-container {
            background: #0f172a;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            word-break: break-all;
            border: 1px solid #334155;
        }

        #password-display { font-family: monospace; font-size: 1.1rem; color: #38bdf8; }

        .btn-copy {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-copy:hover { opacity: 0.9; }

        .settings { margin-bottom: 1.5rem; }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--primary); }

        .generate-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .generate-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h2>Password Generator</h2>
    
    <div class="result-container">
        <span id="password-display">Click Generate</span>
        <button class="btn-copy" onclick="copyToClipboard()">Copy</button>
    </div>

    <div class="settings">
        <div class="setting-item">
            <label>Length: <span id="length-value">16</span></label>
        </div>
        <input type="range" id="length-slider" min="8" max="90" value="16">
    </div>

    <button class="generate-btn" id="generate">Generate Secure Password</button>

   <footer>
        Created by &bull; Isaac-maker
        </footer>
      
    
</div>  

<script>
    const display = document.getElementById('password-display');
    const slider = document.getElementById('length-slider');
    const lengthVal = document.getElementById('length-value');
    const genBtn = document.getElementById('generate');

    const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";

    // Update length text
    slider.addEventListener('input', () => {
        lengthVal.innerText = slider.value;
    });

    function generatePassword() {
        let length = slider.value;
        let password = "";
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * charset.length);
            password += charset[randomIndex];
        }
        display.innerText = password;
    }

    function copyToClipboard() {
        const text = display.innerText;
        if (text === "Click Generate") return;
        
        navigator.clipboard.writeText(text).then(() => {
            alert("Password copied to clipboard!");
        });
    }

    genBtn.addEventListener('click', generatePassword);
</script>

</body>
</html>
