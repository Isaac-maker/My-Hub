<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif&display=swap"
        rel="stylesheet" />
    <style>
        /* ===== TOKENS ===== */
        :root {
            color-scheme: light dark;

            --bg: #EDF0EE;
            --surface: #FAFBFA;
            --ink: #1C2629;
            --muted: #566462;
            --line: #D5DCD9;
            --accent: #21585A;
            --on-accent: #FFFFFF;
            --tint: #E0EBE9;
            --shadow: 0 8px 24px rgba(20, 40, 40, 0.09);

            --font-display: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
            --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111718;
                --surface: #182022;
                --ink: #E5ECEA;
                --muted: #95A4A1;
                --line: #2A3538;
                --accent: #86C5BE;
                --on-accent: #0F1A1B;
                --tint: #213133;
                --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            }
        }

        /* ===== BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
            color: inherit;
        }

        .page {
            flex: 1;
            width: min(100% - 3rem, 1240px);
            margin-inline: auto;
            padding: clamp(2.5rem, 6vw, 4.5rem) 0 3rem;
        }

        /* ===== HEADER ===== */
        .head {
            text-align: center;
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: clamp(2.75rem, 6vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.01em;
        }

        .lede {
            margin-top: 0.6rem;
            color: var(--muted);
        }

        /* ===== SEARCH ===== */
        .search {
            display: flex;
            gap: 0.75rem;
            max-width: 640px;
            margin: 2rem auto 0;
        }

        .field {
            position: relative;
            flex: 1;
        }

        .field svg {
            position: absolute;
            left: 17px;
            top: 50%;
            translate: 0 -50%;
            width: 18px;
            height: 18px;
            color: var(--muted);
            pointer-events: none;
        }

        .field input {
            width: 100%;
            height: 48px;
            padding: 0 1.1rem 0 2.9rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .field input::placeholder {
            color: var(--muted);
            opacity: 0.85;
        }

        .field input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-color: var(--accent);
        }

        .btn-search {
            height: 48px;
            padding: 0 1.6rem;
            background: var(--accent);
            color: var(--on-accent);
            border: 0;
            border-radius: 999px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-search:hover {
            opacity: 0.88;
        }

        .btn-search:focus-visible,
        .filter-btn:focus-visible,
        .reset:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ===== TOOLBAR (filtrar / ordenar) ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0 2rem;
        }

        .filter {
            position: relative;
        }

        .filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            height: 36px;
            padding: 0 0.85rem 0 1rem;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filter-btn:hover,
        .filter-btn[aria-expanded="true"] {
            border-color: var(--accent);
        }

        .filter-btn .chev {
            width: 14px;
            height: 14px;
            transition: transform 0.2s;
        }

        .filter-btn[aria-expanded="true"] .chev {
            transform: rotate(180deg);
        }

        .filter-btn .dot {
            display: none;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .filter-btn.active .dot {
            display: inline-block;
        }

        .count {
            font-size: 0.875rem;
            color: var(--muted);
        }

        .menu {
            position: absolute;
            z-index: 10;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: min(320px, calc(100vw - 2rem));
            display: grid;
            gap: 1rem;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .menu fieldset {
            border: 0;
            min-width: 0;
        }

        .menu legend {
            padding: 0;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
        }

        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .pill {
            position: relative;
        }

        .pill input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;
            cursor: pointer;
        }

        .pill span {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.85rem;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .pill input:hover+span {
            border-color: var(--accent);
        }

        .pill input:checked+span {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        .pill input:focus-visible+span {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .reset {
            justify-self: start;
            padding: 0;
            background: none;
            border: 0;
            color: var(--accent);
            font-size: 0.85rem;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        /* ===== GRID ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 1rem;
        }

        @media (max-width: 1180px) {
            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 940px) {
            .grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 660px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 420px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .search {
                gap: 0.5rem;
            }

            .btn-search {
                padding: 0 1.1rem;
            }
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 220px;
            padding: 1.5rem 1.1rem 1.25rem;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .icon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            margin-bottom: 0.85rem;
            background: var(--tint);
            color: var(--accent);
            border-radius: 12px;
        }

        .icon svg {
            width: 22px;
            height: 22px;
        }

        .card h2 {
            font-size: 1.02rem;
            font-weight: 600;
            line-height: 1.25;
        }

        .card p {
            margin-top: 0.35rem;
            font-size: 0.84rem;
            line-height: 1.45;
            color: var(--muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* El enlace cubre toda la tarjeta */
        .card a {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: auto;
            padding-top: 0.9rem;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .card a::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 16px;
        }

        .card a:focus-visible {
            outline: none;
        }

        .card a:focus-visible::after {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .card a svg {
            width: 14px;
            height: 14px;
            transition: transform 0.2s;
        }

        .card:hover a svg {
            transform: translate(2px, -2px);
        }

        .card-add {
            justify-content: center;
            gap: 0.6rem;
            background: transparent;
            border-style: dashed;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .card-add:hover {
            border-color: var(--line);
            box-shadow: none;
            transform: none;
        }

        .card-add svg {
            width: 26px;
            height: 26px;
        }

        /* ===== ESTADO VACÍO ===== */
        .empty {
            padding: 3rem 1rem;
            text-align: center;
            color: var(--muted);
        }

        .empty strong {
            display: block;
            margin-bottom: 0.25rem;
            color: var(--ink);
            font-weight: 600;
        }

        .empty .reset {
            margin-top: 0.75rem;
        }

        /* ===== FOOTER ===== */
        footer {
            width: min(100% - 3rem, 1240px);
            margin-inline: auto;
            padding: 1.25rem 0 2rem;
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
        }

        footer strong {
            color: var(--ink);
            font-weight: 500;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <header class="head">
            <h1>My Hub</h1>
            <p class="lede">Mis herramientas web, en un solo lugar.</p>
        </header>

        <form class="search" role="search" id="search-form">
            <div class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg>
                <input type="search" id="q" placeholder="Buscar herramientas" aria-label="Buscar herramientas"
                    autocomplete="off" />
            </div>
            <button class="btn-search" type="submit">Buscar</button>
        </form>

        <div class="toolbar">
            <div class="filter">
                <button class="filter-btn" id="filter-btn" type="button" aria-expanded="false"
                    aria-controls="menu">
                    <span class="dot" aria-hidden="true"></span>
                    Filtrar y ordenar
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </button>

                <div class="menu" id="menu" hidden>
                    <fieldset>
                        <legend>Ordenar por</legend>
                        <div class="pills" id="sort-pills"></div>
                    </fieldset>
                    <fieldset>
                        <legend>Categoría</legend>
                        <div class="pills" id="cat-pills"></div>
                    </fieldset>
                    <button class="reset" id="reset" type="button">Restablecer</button>
                </div>
            </div>
            <span class="count" id="count" aria-live="polite"></span>
        </div>

        <section class="grid" id="grid" aria-label="Proyectos"></section>

        <div class="empty" id="empty" hidden>
            <strong>No encontramos herramientas con esa búsqueda</strong>
            Prueba con otra palabra o quita los filtros.
            <div><button class="reset" id="clear" type="button">Limpiar búsqueda</button></div>
        </div>

    </main>

    <footer>
        Creado por <strong>Isaac-maker</strong>
    </footer>

    <script>
        /* ============================================================
           PROYECTOS — para agregar uno nuevo, añade un objeto a esta lista.
           cat: image | video | audio | docs | util
           ============================================================ */
        const PROJECTS = [
            { name: 'Password Generator', desc: 'A sleek, lightweight, and secure web-based password generator.', href: 'Password_Generator/index.html', cat: 'util' },
            { name: 'Image Metadata Remover', desc: 'Inspect, extract, and remove image metadata including EXIF data — fully client-side.', href: 'Image-Metadata-Remover/index.html', cat: 'image' },
            { name: 'Image Compressor', desc: 'A lightweight, client-side image compression tool.', href: 'Image-Compressor/index.html', cat: 'image' },
            { name: 'ID PDF Generator', desc: 'Converts the front and back of an ID card into a single A4 PDF.', href: 'ID-PDF-Generator/index.html', cat: 'docs' },
            { name: 'Icon Resizer • Flutter', desc: 'Transform a 512×512 PNG into all standard icon sizes for Flutter (Android & Web).', href: 'Icon-Resizer-Flutter/index.html', cat: 'image' },
            { name: 'File Converter PDF', desc: 'Convert Word docs, images, and PDFs in your browser — no server, no uploads.', href: 'File-Converter-PDF/index.html', cat: 'docs' },
            { name: 'Calendario', desc: 'Full annual calendar in a dynamic grid. Mobile-first, fast, and lightweight.', href: 'Calendario/index.html', cat: 'util' },
            { name: 'Bulk Image Cropper', desc: 'Crop multiple images to a fixed resolution and export as PNG in a ZIP — fully client-side.', href: 'Bulk Manual Image Cropper (PNG Export)/index.html', cat: 'image' },
            { name: 'Video — Frames', desc: 'Convert your videos to frames.', href: 'Video-Frames/index.html', cat: 'video' },
            { name: 'Video — Image', desc: 'Convert your video to an image.', href: 'Video-Image/index.html', cat: 'video' },
            { name: 'Video — Preview', desc: 'See preview video.', href: 'Preview/index.html', cat: 'video' },
            { name: 'Corte — Audio', desc: 'Cut audio and beats.', href: 'Corte/index.html', cat: 'audio' }
        ];

        const CATS = {
            image: { label: 'Imagen', icon: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-5-8 8"/>' },
            video: { label: 'Video', icon: '<rect x="3" y="5" width="14" height="14" rx="2"/><path d="m17 10 4-2.5v9L17 14"/>' },
            audio: { label: 'Audio', icon: '<path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>' },
            docs: { label: 'Documentos', icon: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>' },
            util: { label: 'Utilidades', icon: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>' }
        };

        const SORTS = [
            { id: 'orig', label: 'Original' },
            { id: 'az', label: 'Nombre A–Z' },
            { id: 'za', label: 'Nombre Z–A' }
        ];

        const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
        const svg = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
        const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        const state = { q: '', sort: 'orig', cat: 'all' };

        const $ = (id) => document.getElementById(id);
        const grid = $('grid'), empty = $('empty'), count = $('count');
        const filterBtn = $('filter-btn'), menu = $('menu');

        /* ----- Opciones del menú ----- */
        function pills(container, name, options, checked) {
            container.innerHTML = options.map(o => `
                <label class="pill">
                    <input type="radio" name="${name}" value="${o.id}" ${o.id === checked ? 'checked' : ''}>
                    <span>${o.label}</span>
                </label>`).join('');
        }

        pills($('sort-pills'), 'sort', SORTS, state.sort);
        pills($('cat-pills'), 'cat',
            [{ id: 'all', label: 'Todas' }, ...Object.entries(CATS).map(([id, c]) => ({ id, label: c.label }))],
            state.cat);

        /* ----- Render ----- */
        function render() {
            const q = norm(state.q.trim());

            let list = PROJECTS
                .map((p, i) => ({ ...p, i }))
                .filter(p => state.cat === 'all' || p.cat === state.cat)
                .filter(p => !q || norm(`${p.name} ${p.desc} ${CATS[p.cat].label}`).includes(q));

            if (state.sort === 'az') list.sort((a, b) => a.name.localeCompare(b.name, 'es'));
            if (state.sort === 'za') list.sort((a, b) => b.name.localeCompare(a.name, 'es'));

            const cards = list.map(p => `
                <article class="card">
                    <div class="icon">${svg(CATS[p.cat].icon)}</div>
                    <h2>${esc(p.name)}</h2>
                    <p>${esc(p.desc)}</p>
                    <a href="${esc(encodeURI(p.href))}" target="_blank" rel="noopener">Abrir proyecto ${ARROW}</a>
                </article>`).join('');

            const isDefault = !q && state.cat === 'all';
            const slot = isDefault ? `
                <div class="card card-add" aria-hidden="true">
                    ${svg('<path d="M12 5v14M5 12h14"/>')}
                    Próximo proyecto
                </div>` : '';

            grid.innerHTML = cards + slot;
            empty.hidden = list.length > 0;

            const n = list.length, total = PROJECTS.length;
            const noun = n === 1 ? 'herramienta' : 'herramientas';
            count.textContent = n === total ? `${total} ${noun}` : `${n} de ${total} ${noun}`;

            filterBtn.classList.toggle('active', state.sort !== 'orig' || state.cat !== 'all');
        }

        /* ----- Eventos ----- */
        $('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });

        $('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            state.q = $('q').value;
            render();
            grid.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        menu.addEventListener('change', (e) => {
            state[e.target.name] = e.target.value;
            render();
        });

        function setMenu(open) {
            menu.hidden = !open;
            filterBtn.setAttribute('aria-expanded', String(open));
        }

        filterBtn.addEventListener('click', () => setMenu(menu.hidden));

        document.addEventListener('click', (e) => {
            if (!menu.hidden && !e.target.closest('.filter')) setMenu(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !menu.hidden) { setMenu(false); filterBtn.focus(); }
        });

        function resetAll() {
            state.q = ''; state.sort = 'orig'; state.cat = 'all';
            $('q').value = '';
            document.querySelector('input[name="sort"][value="orig"]').checked = true;
            document.querySelector('input[name="cat"][value="all"]').checked = true;
            render();
        }

        $('reset').addEventListener('click', resetAll);
        $('clear').addEventListener('click', resetAll);

        render();
    </script>

</body>

</html>
